name: Core AI CI trial

# Temporary: runs only the coreai-parity job on pushes to this trial branch, to check whether GitHub's
# macOS 27 (xcode-27) image can run Core AI. Not part of the proposed pull request.
on:
  push:
    branches: ["coreai-ci-trial"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coreai-parity:
    name: Core AI parity
    # Running an .aimodel needs the Core AI runtime of macOS 27. GitHub's Xcode 27 image is the only hosted runner
    # on macOS 27 (arm64 only, public preview), so this job is not part of export-priority-guardian yet: a preview
    # queue must not block merges. The unit tests in test_coreai_export.py run without it in the CPU jobs.
    runs-on: xcode-27
    concurrency:
      group: pytest-coreai-${{ matrix.python-version }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # coreai-torch requires Python >= 3.11 and coreai-core ships cp311-cp313 wheels, so 3.11 and 3.13 bracket
        # the range the [coreai] extra installs on.
        python-version: ["3.11", "3.13"]
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: 🐍 Install uv and set Python version ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: 🚀 Install Packages (coreai extra)
        timeout-minutes: 8
        run: uv pip install -e ".[coreai,train,augment,cli,visual]" --group tests

      - name: 🔎 Verify the Core AI runtime
        # Guard against a silently-skipped parity test: TestCoreAIEndToEnd skips without coreai-torch or the macOS 27
        # runtime, so a broken wheel or an older image would turn the job green instead of red.
        run: |
          import coreai.runtime as rt

          from rfdetr.export._coreai import _IS_COREAI_TORCH_AVAILABLE

          assert _IS_COREAI_TORCH_AVAILABLE, "coreai-torch installed but not detected as available"
          print("Core AI compute units:", rt.ComputeUnitKind.available_kinds())
        shell: python

      - name: 🧪 Run Core AI end-to-end parity tests
        run: |
          uv run --no-sync pytest tests/export/test_coreai_export.py \
            -m e2e_coreai -n 1 -v \
            --timeout=600 \
            --durations=20

      - name: Minimize uv cache
        continue-on-error: true
        run: uv cache prune --ci
